<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>🌱 语芽 · 轻松学英语</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">

  <!-- ===== 顶部标题 ===== -->
  <div class="app-title">🌱 <span>语芽</span> · 轻松学英语</div>

  <!-- ========================================================== -->
  <!-- PAGE: 主页 -->
  <!-- ========================================================== -->
  <div class="page active" id="page-home">

    <!-- 成长树 -->
    <div class="home-tree-section">
      <div style="font-size:14px;color:var(--text-light);margin-bottom:4px" id="treeName">小种子</div>
      <div class="tree-emoji" id="treeEmoji">🌱</div>
      <div class="tree-progress-bar">
        <div class="tree-progress-fill" id="treeProgressFill"></div>
      </div>
      <div class="tree-water-count">💧 水滴 <span id="waterCount">0</span></div>
    </div>

    <!-- 每日目标 -->
    <div class="daily-goal-section">
      <div>
        <div class="daily-goal-label">🎯 今日目标</div>
        <div class="daily-goal-value" id="dailyGoalValue">0/5 分钟</div>
      </div>
      <div class="daily-goal-progress">
        <div class="daily-goal-fill" id="dailyGoalFill"></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="option-btn" style="padding:8px 14px;font-size:12px;flex:none" onclick="setDailyGoal(5)">5分钟</button>
        <button class="option-btn" style="padding:8px 14px;font-size:12px;flex:none" onclick="setDailyGoal(10)">10分钟</button>
      </div>
    </div>

    <!-- 快速开始 -->
    <div style="margin-bottom:12px">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px">📖 快速开始</div>
      <div style="display:flex;gap:8px" id="recentLevels"></div>
    </div>

    <!-- 学习统计 -->
    <div style="display:flex;gap:12px">
      <div style="flex:1;background:var(--card-bg);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow)">
        <div style="font-size:28px;font-weight:800;color:var(--primary)" id="learnedWords">0</div>
        <div style="font-size:12px;color:var(--text-light)">📚 已学单词</div>
      </div>
      <div style="flex:1;background:var(--card-bg);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow)">
        <div style="font-size:28px;font-weight:800;color:var(--green)" id="totalWords">0</div>
        <div style="font-size:12px;color:var(--text-light)">🎯 词库总数</div>
      </div>
      <div style="flex:1;background:var(--card-bg);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow)">
        <div style="font-size:28px;font-weight:800;color:var(--accent)" id="completedLevels">0</div>
        <div style="font-size:12px;color:var(--text-light)">🏆 通关数</div>
      </div>
    </div>
  </div>

  <!-- ========================================================== -->
  <!-- PAGE: 关卡选择 -->
  <!-- ========================================================== -->
  <div class="page" id="page-levels">
    <div style="margin-bottom:12px">
      <div style="font-size:18px;font-weight:700;text-align:center">🗺️ 闯关地图</div>
      <div style="text-align:center;font-size:13px;color:var(--text-light);margin-top:4px">
        学完一关解锁下一关
      </div>
    </div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <!-- ========================================================== -->
  <!-- PAGE: 答题 -->
  <!-- ========================================================== -->
  <div class="page" id="page-quiz">
    <div class="quiz-header">
      <button class="quiz-back-btn" onclick="showPage('page-levels')">←</button>
      <span class="quiz-progress-text" id="quizProgress">1 / 10</span>
    </div>
    <div class="quiz-progress-dots" id="quizDots"></div>

    <div id="questionCard" class="quiz-card">
      <!-- 题目由 JS 动态渲染 -->
    </div>

    <div id="explainArea"></div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">继续 →</button>
  </div>

  <!-- ========================================================== -->
  <!-- PAGE: 贴纸 -->
  <!-- ========================================================== -->
  <div class="page" id="page-stickers">
    <div style="margin-bottom:12px">
      <div class="sticker-section-title">🏅 贴纸收集册</div>
      <div style="text-align:center;font-size:13px;color:var(--text-light)">
        每通过 3 关获得一张新贴纸
      </div>
      <div style="text-align:center;font-size:20px;font-weight:700;color:var(--primary);margin-top:4px" id="stickerCount">0 / 9</div>
    </div>
    <div class="sticker-grid" id="stickerGrid"></div>
  </div>

  <!-- ========================================================== -->
  <!-- 反馈叠加层 -->
  <!-- ========================================================== -->
  <div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-content">
      <span class="feedback-emoji" id="feedbackEmoji">🎉</span>
      <span style="font-size:60px;display:block" id="feedbackAnimal">🐱</span>
      <div class="feedback-text" id="feedbackText">太棒了！</div>
    </div>
  </div>

  <!-- 庆祝容器 -->
  <div class="celebration-container" id="celebration"></div>

  <!-- 贴纸解锁 -->
  <div class="sticker-unlock" id="stickerUnlock">
    <div class="sticker-unlock-card">
      <div class="big" id="stickerUnlockEmoji">🌟</div>
      <div class="title" id="stickerUnlockName">新贴纸</div>
      <div class="desc">太棒了！获得新贴纸 🎉</div>
      <button class="btn" onclick="closeStickerUnlock()">收起</button>
    </div>
  </div>

  <!-- 每日目标完成 -->
  <div class="goal-celebration" id="goalCelebration">
    <div class="goal-celebration-card">
      <div class="big">🎯</div>
      <div class="title">今日目标达成！</div>
      <div class="desc">你真棒！明天继续来学吧 🌱</div>
      <button class="option-btn" style="margin-top:12px;background:var(--primary);color:#fff;border:none;padding:12px 28px" onclick="closeGoalCelebration()">好的！</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div><!-- /app-container -->

<!-- ===== 底部导航 ===== -->
<div class="bottom-nav">
  <button class="nav-btn active" data-page="page-home" onclick="showPage('page-home')">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">首页</span>
  </button>
  <button class="nav-btn" data-page="page-levels" onclick="showPage('page-levels')">
    <span class="nav-icon">🗺️</span>
    <span class="nav-label">闯关</span>
  </button>
  <button class="nav-btn" data-page="page-quiz" onclick="showPage('page-quiz')">
    <span class="nav-icon">✍️</span>
    <span class="nav-label">答题</span>
  </button>
  <button class="nav-btn" data-page="page-stickers" onclick="showPage('page-stickers')">
    <span class="nav-icon">🏅</span>
    <span class="nav-label">贴纸</span>
  </button>
</div>

<!-- ===== 脚本加载 ===== -->
<script src="js/words.js"></script>
<script src="js/app.js"></script>

</body>
</html>
